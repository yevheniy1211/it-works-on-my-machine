services:
  postgres:
    image: postgres:17.2-alpine
    restart: always
    volumes:
      - it-works-postgres-data:/var/lib/postgresql/data
    ports:
      - 15562:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it-works-db
    networks:
      - it-works-network

  redis:
    image: redis:7.4.2-alpine
    restart: always
    ports:
      - "63821:6379"
    volumes:
      - it-works-redis-data:/data
    networks:
      - it-works-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_PORT: 6379
      REDIS_ENDPOINT: redis
      DB_ENDPOINT: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: it-works-db
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    networks:
      - it-works-network

volumes:
  it-works-postgres-data:
    driver: local
  it-works-redis-data:
    driver: local
