global:
  scrape_interval:      15s
  evaluation_interval:  15s

scrape_configs:
  - job_name: 'docker-daemon'
    static_configs:
      - targets: ['host.docker.internal:9323']
  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
  - job_name: 'go-backend'
    static_configs:
      - targets: [ 'backend:8080' ]